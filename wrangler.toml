name = "plushtoys"
main = "worker/index.js"
compatibility_date = "2026-11-04"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [
  "/api/*",
  "/",
  "/product*",
  "/checkout*",
  "/faq*",
  "/shipping-returns*",
  "/privacy*",
  "/terms*",
  "/contact*",
  "/*.html",
]

# Order records are stored in D1.
[[d1_databases]]
binding = "ORDERS_DB"
database_name = "plush-story-orders"
database_id = "e69084e6-ca2c-44e5-86b3-2e229cc60c9c"
