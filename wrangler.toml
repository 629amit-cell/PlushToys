name = "plushtoys"
main = "worker/index.js"
compatibility_date = "2026-11-04"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Optional but recommended for order records. Create the database with:
#   npx wrangler d1 create plush-story-orders
# Then replace the database_id below with the value Wrangler prints.
#
# [[d1_databases]]
# binding = "ORDERS_DB"
# database_name = "plush-story-orders"
# database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
